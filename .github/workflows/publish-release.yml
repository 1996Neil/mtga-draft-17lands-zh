name: Build macOS Chinese app (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Build without any local game localization input
        run: poetry run pyinstaller candidate.spec --noconfirm
      - name: Verify signature and absence of full English text dump
        run: |
          test ! -e dist/MTGA_17Lands_ZH_Candidate.app/Contents/Resources/resources/arena/english.json
          codesign --verify --deep --strict dist/MTGA_17Lands_ZH_Candidate.app
          ditto -c -k --keepParent dist/MTGA_17Lands_ZH_Candidate.app MTGA-17Lands-ZH-macOS.zip
          shasum -a 256 MTGA-17Lands-ZH-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MTGA-17Lands-ZH-macOS
          path: MTGA-17Lands-ZH-macOS.zip
          retention-days: 1
